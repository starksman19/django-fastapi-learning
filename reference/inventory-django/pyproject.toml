[project]
name = "inventory-django"
version = "0.1.0"
description = "Reference Inventory and Orders API implemented with Django REST Framework."
requires-python = ">=3.12,<3.14"
dependencies = [
    "Django>=5.2,<6.0",
    "django-filter>=25.1,<26.0",
    "djangorestframework>=3.16,<4.0",
    "drf-spectacular>=0.28,<1.0",
    "gunicorn>=23.0,<24.0",
    "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.10,<5.0",
]

[tool.uv]
package = false
